<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f5d3a">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pflanzen">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Pflanzen lernen Kurs 01</title>
<style>
:root{--bg:#f6f8f5;--card:#fff;--ink:#1c2420;--mut:#5d6b62;--g:#2f5d3a;--gl:#e4eee6;--ok:#2e7d32;--bad:#c62828;--line:#d5ddd6}
@media (prefers-color-scheme:dark){:root{--bg:#141a16;--card:#1d2620;--ink:#e8efe9;--mut:#9aab9f;--g:#7fc08f;--gl:#26352a;--ok:#66bb6a;--bad:#ef5350;--line:#33423a}}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
header{background:var(--g);color:#fff;padding:12px 16px}
@media (prefers-color-scheme:dark){header{background:#1f3a27;color:#e8efe9}}
header h1{margin:0;font-size:18px}
header p{margin:2px 0 0;font-size:12px;opacity:.85}
nav{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav button{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:8px 12px;border-radius:20px;font-size:14px;white-space:nowrap;cursor:pointer}
nav button.on{background:var(--g);color:#fff;border-color:var(--g)}
main{max-width:860px;margin:0 auto;padding:14px 14px 60px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
select,input[type=search]{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font-size:14px}
input[type=search]{flex:1;min-width:150px}
.btn{border:none;background:var(--g);color:#fff;padding:11px 16px;border-radius:10px;font-size:15px;cursor:pointer}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.ok{background:var(--ok)} .btn.bad{background:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:14px}
.photos{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.photos figure{margin:0;flex:1 1 150px;max-width:300px}
.photos img{width:100%;height:170px;object-fit:cover;border-radius:8px;display:block;background:var(--gl)}
.photos figcaption{font-size:11px;color:var(--mut);text-align:center;margin-top:2px}
.lat{font-style:italic;font-weight:bold;color:var(--g);font-size:18px}
.de{font-weight:bold;font-size:18px}
.mk{margin-top:8px;font-size:14px}
.tag{display:inline-block;font-size:11px;background:var(--gl);color:var(--g);padding:2px 8px;border-radius:10px;margin-bottom:6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opts button{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:15px;text-align:left;cursor:pointer}
.opts button.right{background:var(--ok);color:#fff;border-color:var(--ok)}
.opts button.wrong{background:var(--bad);color:#fff;border-color:var(--bad)}
.stat{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-bottom:10px}
.bar{height:8px;background:var(--gl);border-radius:5px;overflow:hidden;margin:6px 0 12px}
.bar i{display:block;height:100%;background:var(--ok)}
.big{font-size:15px;margin:6px 0}
.hint{font-size:12px;color:var(--mut)}
.item{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.item img{width:64px;height:64px;object-fit:cover;border-radius:8px;flex:none;background:var(--gl)}
.item .s{font-size:12px;color:var(--mut)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--line)}
.dot.k{background:var(--ok)} .dot.n{background:var(--bad)}
.hide{display:none}
.photos img,.item img{cursor:zoom-in}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;padding:10px}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:78vh;object-fit:contain;border-radius:6px;cursor:default}
#lb .cp{color:#fff;font-size:14px;text-align:center;margin-top:10px;max-width:700px}
#lb .cp small{display:block;opacity:.7;font-size:12px}
#lb button{position:absolute;background:rgba(255,255,255,.15);color:#fff;border:none;font-size:28px;width:48px;height:48px;border-radius:50%;cursor:pointer}
#lb .x{top:12px;right:12px} #lb .pv{left:10px;top:50%} #lb .nx{right:10px;top:50%}
html{-webkit-text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;padding-bottom:env(safe-area-inset-bottom)}
header{padding-top:calc(12px + env(safe-area-inset-top))}
select,input[type=search]{font-size:16px}
.btn,.opts button,nav button{touch-action:manipulation}
@media (max-width:600px){
 nav{gap:4px;padding:8px 8px} nav button{padding:9px 9px;font-size:13px;flex:1 1 auto}
 header p{display:none}
 header h1{font-size:16px} main{padding:10px 10px 30px}
 .btn{padding:14px 16px;flex:1} .row .btn{min-width:45%}
 .photos figure{flex:1 1 44%}.photos img{height:140px}
 .opts button{padding:14px}
 .item img{width:56px;height:56px}
 #lb .pv,#lb .nx{width:40px;height:40px;font-size:22px}
}
footer{max-width:860px;margin:0 auto;padding:10px 14px 40px;font-size:12px;color:var(--mut)}
footer a{color:var(--g)}
</style>
</head>

<script>
const DATA=[{"id": 0, "g": "K", "lat": "Abies alba", "de": "Weißtanne", "mk": "Nadeln flach, an der Spitze oft ausgerandet, unterseits zwei weiße Streifen. Zapfen stehen aufrecht und zerfallen am Baum. Rinde jung glatt und grau, später rissig. Heimischer Waldbaum. Tanne sticht nicht.", "img": [{"s": "img/000_0.jpg", "l": "Wuchs"}, {"s": "img/000_1.jpg", "l": "Nadeln (flach, unterseits weiße Streifen)"}, {"s": "img/000_2.jpg", "l": "Zapfen (aufrecht)"}, {"s": "img/000_3.jpg", "l": "Rinde"}]}, {"id": 1, "g": "K", "lat": "Abies concolor", "de": "Kolorado-Tanne", "mk": "Lange (4–6 cm), blaugrüne, beidseits gleichfarbige Nadeln, leicht gebogen, duften nach Zitrus. Aufrechte Zapfen. Trockenheits- und stadtklimaverträglicher als andere Tannen.", "img": [{"s": "img/001_0.jpg", "l": "Wuchs"}, {"s": "img/001_1.jpg", "l": "Nadeln"}, {"s": "img/001_2.jpg", "l": "Zapfen (aufrecht)"}, {"s": "img/001_3.jpg", "l": "Rinde"}]}, {"id": 2, "g": "K", "lat": "Abies koreana", "de": "Korea-Tanne", "mk": "Klein bleibender Baum, Nadeln kurz, unterseits silberweiß. Zapfen schon an jungen Pflanzen, violett-blau, aufrecht. Beliebte Ziertanne für Gärten.", "img": [{"s": "img/002_0.jpg", "l": "Wuchs"}, {"s": "img/002_1.jpg", "l": "Zweig mit Nadeln"}, {"s": "img/002_2.jpg", "l": "Zapfen (violettblau)"}, {"s": "img/002_3.jpg", "l": "Zapfenschuppen"}]}, {"id": 3, "g": "K", "lat": "Abies nordmanniana", "de": "Nordmann-Tanne", "mk": "Dicht benadelt, Nadeln weich und nicht stechend, oben glänzend dunkelgrün, unterseits zwei weiße Streifen. Klassischer Weihnachtsbaum. Aufrechte Zapfen.", "img": [{"s": "img/003_0.jpg", "l": "Wuchs"}, {"s": "img/003_1.jpg", "l": "Nadeln"}, {"s": "img/003_2.jpg", "l": "Zapfen"}, {"s": "img/003_3.jpg", "l": "Rinde"}]}, {"id": 4, "g": "K", "lat": "Abies nobilis", "de": "Edeltanne", "mk": "Der Name Abies nobilis ist ein Synonym für Abies procera. Blaugrüne Nadeln, aufwärts gebogen. Sehr große, aufrechte Zapfen mit auffällig herausragenden Deckschuppen. Schnittgrün für Dekoration.", "img": [{"s": "img/004_0.jpg", "l": "Wuchs"}, {"s": "img/004_1.jpg", "l": "Nadeln (Zweigunterseite)"}, {"s": "img/004_2.jpg", "l": "Zapfen (aufrecht)"}, {"s": "img/004_3.jpg", "l": "Rinde"}]}, {"id": 5, "g": "K", "lat": "Araucaria araucana", "de": "Andentanne", "mk": "Schuppenartige, stechende, dreieckige Blätter, die dachziegelartig den Trieb bedecken (Schlangenbaum). Wirkt urtümlich, schirmförmige Krone im Alter. Frostempfindlich in kalten Lagen.", "img": [{"s": "img/005_0.jpg", "l": "Wuchs"}, {"s": "img/005_1.jpg", "l": "Beschuppte Blätter"}, {"s": "img/005_2.jpg", "l": "Zapfen"}, {"s": "img/005_3.jpg", "l": "Stamm"}]}, {"id": 6, "g": "K", "lat": "Chamaecyparis lawsoniana", "de": "Lawsons Scheinzypresse", "mk": "Flache, überhängende Zweigspitzen, schuppenförmige Blätter, Zweigunterseite mit weißen Zeichnungen (Y- oder X-Muster). Kleine kugelige Zapfen. Rinde rötlich-braun, faserig.", "img": [{"s": "img/006_0.jpg", "l": "Wuchs"}, {"s": "img/006_1.jpg", "l": "Zweige (flach)"}, {"s": "img/006_2.jpg", "l": "Zapfen"}, {"s": "img/006_3.jpg", "l": "Stamm"}]}, {"id": 7, "g": "K", "lat": "Chamaecyparis lawsoniana ‘Glauca’", "de": "Blaue Scheinzypresse", "mk": "Sorte der Lawsons Scheinzypresse mit blaugrauer Benadelung. Dichter, schmal kegelförmiger Wuchs. Wie die Art bevorzugt luftfeucht, nicht zu trocken.", "img": [{"s": "img/007_0.jpg", "l": "Wuchs"}, {"s": "img/007_1.jpg", "l": "Zweig (blaugrau)"}, {"s": "img/007_2.jpg", "l": "Stamm"}]}, {"id": 8, "g": "K", "lat": "Chamaecyparis nootkatensis ‘Pendula’", "de": "Hänge-Scheinzypresse", "mk": "Hängende Zweige wie Vorhänge, Wuchs schlank und malerisch. Schuppenblätter graugrün, beim Zerreiben unangenehmer Geruch. Auch Xanthocyparis nootkatensis.", "img": [{"s": "img/008_0.jpg", "l": "Wuchs"}, {"s": "img/008_1.jpg", "l": "Allee"}, {"s": "img/008_2.jpg", "l": "Hängende Zweige"}, {"s": "img/008_3.jpg", "l": "Zapfen"}]}, {"id": 9, "g": "K", "lat": "Chamaecyparis obtusa ‘Nana Gracilis’", "de": "Muschelzypresse", "mk": "Langsam wachsend, zwergig bis halbhoch. Zweige muschelartig gewellt, dunkelgrün glänzend, Zweigunterseite mit weißen Spaltöffnungslinien. Gut für Steingarten und Kübel.", "img": [{"s": "img/009_0.jpg", "l": "Wuchs"}, {"s": "img/009_1.jpg", "l": "Muschelartig gewellte Zweige"}, {"s": "img/009_2.jpg", "l": "Zweig (Nahaufnahme)"}]}, {"id": 10, "g": "K", "lat": "Cupressus sempervirens", "de": "Mittelmeer-Zypresse", "mk": "Schlank säulenförmig, Zweige straff nach oben. Dunkelgrüne Schuppenblätter, Zapfen kugelig, holzig. Im Mittelmeerraum typisch. Bei uns frostempfindlich, nur milde Lagen.", "img": [{"s": "img/010_0.jpg", "l": "Wuchs (säulenförmig)"}, {"s": "img/010_1.jpg", "l": "Zweige (Schuppenblätter)"}, {"s": "img/010_2.jpg", "l": "Zapfen (geöffnet)"}, {"s": "img/010_3.jpg", "l": "Rinde"}]}, {"id": 11, "g": "K", "lat": "Cupressus × leylandii", "de": "Leyland-Zypresse", "mk": "Sehr raschwüchsig (50 cm bis 1 m im Jahr), Zweige flach, schuppenförmige graugrüne Blätter. Hecke, wird oft zu hoch. Nicht mehr regenerierbar bei Rückschnitt ins alte Holz.", "img": [{"s": "img/011_0.jpg", "l": "Wuchs"}, {"s": "img/011_1.jpg", "l": "Zweig (flach, schuppig)"}, {"s": "img/011_2.jpg", "l": "Zapfen"}, {"s": "img/011_3.jpg", "l": "Stamm"}]}, {"id": 12, "g": "K", "lat": "Juniperus communis", "de": "Gemeiner Wacholder", "mk": "Nadeln dreizählig im Quirl, stechend, oberseits mit weißem Band. Beerenzapfen blauschwarz, zweijährig. Zweihäusig. Heimisch, typisch für Heiden.", "img": [{"s": "img/012_0.jpg", "l": "Wuchs"}, {"s": "img/012_1.jpg", "l": "Nadeln im Dreierquirl"}, {"s": "img/012_2.jpg", "l": "Beerenzapfen"}, {"s": "img/012_3.jpg", "l": "Säulenform"}]}, {"id": 13, "g": "K", "lat": "Juniperus communis ‘Repanda’", "de": "Kriech-Wacholder", "mk": "Niederliegend, teppichartig, bis ca. 40 cm hoch. Etwas weichere Nadeln. Bodendecker für Sonne und Trockenheit.", "img": [{"s": "img/013_0.jpg", "l": "Niederliegender Wuchs (Art)"}, {"s": "img/013_1.jpg", "l": "Nadeln mit weißem Band (Art)"}, {"s": "img/013_2.jpg", "l": "Beerenzapfen (Art)"}]}, {"id": 14, "g": "K", "lat": "Juniperus horizontalis", "de": "Teppich-Wacholder", "mk": "Flach am Boden kriechend, oft blaugrün, im Winter bronzefarben. Schuppen- und Nadelblätter gemischt. Robuster Bodendecker für Sonne und Böschungen.", "img": [{"s": "img/014_0.jpg", "l": "Wuchs (Teppich)"}, {"s": "img/014_1.jpg", "l": "Zweige mit Beerenzapfen"}, {"s": "img/014_2.jpg", "l": "Schuppenblätter"}]}, {"id": 15, "g": "K", "lat": "Larix decidua", "de": "Europäische Lärche", "mk": "Nadelbaum, der im Herbst die Nadeln abwirft (goldgelb). Nadeln in Büscheln auf Kurztrieben, weich. Kleine, aufrechte Zapfen, Rinde rissig, rötlich. Lichtbaumart.", "img": [{"s": "img/015_0.jpg", "l": "Wuchs"}, {"s": "img/015_1.jpg", "l": "Nadelbüschel und Zapfen"}, {"s": "img/015_2.jpg", "l": "Herbstfärbung"}, {"s": "img/015_3.jpg", "l": "Rinde"}]}, {"id": 16, "g": "K", "lat": "Metasequoia glyptostroboides", "de": "Urweltmammutbaum", "mk": "Sommergrüne Nadeln, gegenständig gestellt, im Herbst rostbraun. Stamm im Alter mit auffälligem Wurzelanlauf und rötlicher, abblätternder Rinde. Lebendes Fossil.", "img": [{"s": "img/016_0.jpg", "l": "Wuchs (Winter)"}, {"s": "img/016_1.jpg", "l": "Nadeln (gegenständig)"}, {"s": "img/016_2.jpg", "l": "Rinde"}, {"s": "img/016_3.jpg", "l": "Stammfuß"}]}, {"id": 17, "g": "K", "lat": "Picea abies", "de": "Rotfichte", "mk": "Nadeln vierkantig, spitz und stechend, einzeln am Trieb auf Blattkissen. Zapfen hängen und fallen als Ganzes ab. Rinde rotbraun, schuppig. Flachwurzler. Fichte sticht.", "img": [{"s": "img/017_0.jpg", "l": "Wuchs"}, {"s": "img/017_1.jpg", "l": "Zweig mit Nadeln"}, {"s": "img/017_2.jpg", "l": "Zapfen (hängend)"}, {"s": "img/017_3.jpg", "l": "Rinde"}]}, {"id": 18, "g": "K", "lat": "Picea omorika", "de": "Serbische Fichte", "mk": "Sehr schlanke, spitz zulaufende Krone, Äste hängen herab und biegen am Ende nach oben. Nadeln flach, oberseits dunkelgrün, unterseits mit zwei weißen Bändern. Stadtklimaverträglich.", "img": [{"s": "img/018_0.jpg", "l": "Wuchs (schlank)"}, {"s": "img/018_1.jpg", "l": "Nadeln (Unterseite)"}, {"s": "img/018_2.jpg", "l": "Zapfen"}]}, {"id": 19, "g": "K", "lat": "Picea pungens", "de": "Stech-Fichte", "mk": "Sehr stechende, steife Nadeln, bei ‘Glauca’ blaugrau (Blaufichte). Zapfen hängend. Oft als Solitär gepflanzt, wirkt im Alter oft kahl am unteren Stamm.", "img": [{"s": "img/019_0.jpg", "l": "Wuchs"}, {"s": "img/019_1.jpg", "l": "Nadeln (blau)"}, {"s": "img/019_2.jpg", "l": "Zapfen"}, {"s": "img/019_3.jpg", "l": "Rinde"}]}, {"id": 20, "g": "K", "lat": "Pinus mugo", "de": "Bergkiefer", "mk": "Zwei Nadeln pro Kurztrieb, dunkelgrün, 3–5 cm. Strauchig bis niedrig, kriechend (Latsche). Knospen stark harzig. Für Hanglagen, Steingarten, Trockenlagen.", "img": [{"s": "img/020_0.jpg", "l": "Wuchs"}, {"s": "img/020_1.jpg", "l": "Nadelpaare"}, {"s": "img/020_2.jpg", "l": "Zapfen"}]}, {"id": 21, "g": "K", "lat": "Pinus cembra", "de": "Zirbelkiefer", "mk": "Fünf Nadeln pro Büschel, weich, dunkelgrün, innen blaugrün gestreift. Schmale, eiförmige Krone. Zapfen aufrecht, bleiben geschlossen (Zirbelnüsse). Langsam wachsend, frosthart.", "img": [{"s": "img/021_0.jpg", "l": "Wuchs"}, {"s": "img/021_1.jpg", "l": "Zweig mit Zapfen"}, {"s": "img/021_2.jpg", "l": "Zapfen"}]}, {"id": 22, "g": "K", "lat": "Pinus leucodermis", "de": "Schlangenhautkiefer", "mk": "Rinde auf Stamm und Ästen erinnert an Schlangenhaut (graue Platten). Zwei Nadeln, steif, dunkelgrün. Junge Zapfen blau. Wuchs dicht, kegelförmig.", "img": [{"s": "img/022_0.jpg", "l": "Wuchs"}, {"s": "img/022_1.jpg", "l": "Nadeln"}, {"s": "img/022_2.jpg", "l": "Zapfen"}, {"s": "img/022_3.jpg", "l": "Stamm"}]}, {"id": 23, "g": "K", "lat": "Pinus nigra", "de": "Schwarzkiefer", "mk": "Zwei lange (8–16 cm), steife, dunkelgrüne Nadeln pro Kurztrieb. Rinde dunkelgrau-schwarz, tief gefurcht. Verträgt Trockenheit und Hitze. Schirmförmige Krone im Alter.", "img": [{"s": "img/023_0.jpg", "l": "Wuchs"}, {"s": "img/023_1.jpg", "l": "Nadelpaare"}, {"s": "img/023_2.jpg", "l": "Zapfen"}, {"s": "img/023_3.jpg", "l": "Rinde"}]}, {"id": 24, "g": "K", "lat": "Pinus sylvestris", "de": "Waldkiefer", "mk": "Zwei kurze, gedrehte, blaugrüne Nadeln. Oberer Stamm und Äste orange bis rotbraun, Rinde blättert in dünnen Platten ab. Anspruchslos, Lichtbaum, Pioniergehölz.", "img": [{"s": "img/024_0.jpg", "l": "Wuchs"}, {"s": "img/024_1.jpg", "l": "Nadelpaare"}, {"s": "img/024_2.jpg", "l": "Zapfen"}, {"s": "img/024_3.jpg", "l": "Rinde (oben orange)"}]}, {"id": 25, "g": "K", "lat": "Pinus pinea", "de": "Mittelmeerkiefer", "mk": "Schirmförmige Krone (Pinie), zwei lange grüne Nadeln. Große, runde, glänzende Zapfen mit essbaren Pinienkernen. Wärmeliebend, bei uns nicht winterhart.", "img": [{"s": "img/025_0.jpg", "l": "Wuchs (Schirmkrone)"}, {"s": "img/025_1.jpg", "l": "Nadeln"}, {"s": "img/025_2.jpg", "l": "Zapfen"}, {"s": "img/025_3.jpg", "l": "Rinde"}]}, {"id": 26, "g": "K", "lat": "Sequoiadendron giganteum", "de": "Riesenmammutbaum", "mk": "Mächtiger Stamm mit dicker, weicher, rotbrauner, faseriger Rinde. Blätter schuppen- bis pfriemenförmig, zugespitzt. Eiförmige Zapfen. Wird sehr groß, daher nur für große Flächen.", "img": [{"s": "img/026_0.jpg", "l": "Wuchs"}, {"s": "img/026_1.jpg", "l": "Rinde (weich, rotbraun)"}, {"s": "img/026_2.jpg", "l": "Zweig"}]}, {"id": 27, "g": "K", "lat": "Taxodium distichum", "de": "Sumpfzypresse", "mk": "Sommergrün, weiche, gescheitelte Nadeln, die im Herbst braun abfallen. Wurzel bildet im Nassen Atemwurzeln (Pneumatophoren). Für Gewässerränder.", "img": [{"s": "img/027_0.jpg", "l": "Wuchs"}, {"s": "img/027_1.jpg", "l": "Nadeln (gescheitelt)"}, {"s": "img/027_2.jpg", "l": "Atemwurzeln"}, {"s": "img/027_3.jpg", "l": "Rinde"}]}, {"id": 28, "g": "K", "lat": "Taxus baccata", "de": "Europäische Eibe", "mk": "Flache, weiche, glänzend dunkelgrüne Nadeln, kein Harz. Samen von rotem Samenmantel umgeben. Alle Teile außer dem Samenmantel hochgiftig. Sehr schnittverträglich, verträgt Schatten.", "img": [{"s": "img/028_0.jpg", "l": "Wuchs"}, {"s": "img/028_1.jpg", "l": "Nadeln"}, {"s": "img/028_2.jpg", "l": "Samen mit rotem Samenmantel"}, {"s": "img/028_3.jpg", "l": "Stamm"}]}, {"id": 29, "g": "K", "lat": "Thuja occidentalis", "de": "Abendländischer Lebensbaum", "mk": "Flache Zweige mit schuppenförmigen Blättern, die beim Zerreiben aromatisch duften. Kleine, aufrechte Zapfen. Hecke, schnittverträglich, giftig.", "img": [{"s": "img/029_0.jpg", "l": "Wuchs"}, {"s": "img/029_1.jpg", "l": "Zweige (flach, Schuppenblätter)"}, {"s": "img/029_2.jpg", "l": "Zapfen"}, {"s": "img/029_3.jpg", "l": "Stamm"}]}, {"id": 30, "g": "L", "lat": "Acer platanoides", "de": "Spitzahorn", "mk": "Blatt fünflappig mit spitzen Lappen und Zähnen. Milchsaft im Blattstiel. Früchte mit waagrecht abstehenden Flügeln (stumpfwinklig). Blüte gelbgrün vor dem Laubaustrieb. Herbstfärbung gelb.", "img": [{"s": "img/030_0.jpg", "l": "Wuchs"}, {"s": "img/030_1.jpg", "l": "Blatt"}, {"s": "img/030_2.jpg", "l": "Blüte"}, {"s": "img/030_3.jpg", "l": "Rinde"}, {"s": "img/030_4.jpg", "l": "Herbstfärbung"}]}, {"id": 31, "g": "L", "lat": "Acer pseudoplatanus", "de": "Bergahorn", "mk": "Blatt fünflappig, Lappen stumpfer, Rand grob gesägt. Früchte im spitzen Winkel zueinander (Nasenzwicker). Rinde schuppig, platzt später in Platten ab. Hängende Blütentrauben.", "img": [{"s": "img/031_0.jpg", "l": "Wuchs"}, {"s": "img/031_1.jpg", "l": "Früchte (Nasenzwicker)"}, {"s": "img/031_2.jpg", "l": "Blätter"}, {"s": "img/031_3.jpg", "l": "Rinde"}, {"s": "img/031_4.jpg", "l": "Blütentraube"}]}, {"id": 32, "g": "L", "lat": "Acer campestre", "de": "Feldahorn", "mk": "Kleiner Baum oder Großstrauch. Kleine, stumpf gelappte Blätter, Zweige oft mit Korkleisten. Fruchtflügel waagerecht. Schnittverträglich, für Hecken.", "img": [{"s": "img/032_0.jpg", "l": "Wuchs"}, {"s": "img/032_1.jpg", "l": "Blätter"}, {"s": "img/032_2.jpg", "l": "Früchte (waagrechte Flügel)"}, {"s": "img/032_3.jpg", "l": "Zweig mit Korkleisten"}, {"s": "img/032_4.jpg", "l": "Rinde"}]}, {"id": 33, "g": "L", "lat": "Alnus glutinosa", "de": "Schwarzerle", "mk": "Blätter rundlich, an der Spitze oft eingebuchtet, klebrig jung. Kleine, verholzte Zapfen bleiben am Baum. Wurzelknöllchen mit Luftstickstoff. Verträgt Nässe.", "img": [{"s": "img/033_0.jpg", "l": "Wuchs"}, {"s": "img/033_1.jpg", "l": "Zweige (Winter)"}, {"s": "img/033_2.jpg", "l": "Kleine verholzte Zapfen"}, {"s": "img/033_3.jpg", "l": "Rinde"}, {"s": "img/033_4.jpg", "l": "Kätzchen"}]}, {"id": 34, "g": "L", "lat": "Aesculus hippocastanum", "de": "Rosskastanie", "mk": "Handförmig gefingerte Blätter (5–7 Teilblätter), große klebrige Knospen im Winter. Weiße Blütenkerzen im Mai. Stachelige Fruchtkapseln mit glänzenden Samen. Anfällig für Miniermotte.", "img": [{"s": "img/034_0.jpg", "l": "Wuchs"}, {"s": "img/034_1.jpg", "l": "Blätter"}, {"s": "img/034_2.jpg", "l": "Blüte"}, {"s": "img/034_3.jpg", "l": "Frucht"}, {"s": "img/034_4.jpg", "l": "Knospe"}]}, {"id": 35, "g": "L", "lat": "Aesculus parviflora", "de": "Strauch-Rosskastanie", "mk": "Großstrauch bis 3 m, durch Ausläufer breit. Weiße Blütenkerzen im Juli bis August. Gefingerte Blätter. Wuchs breit, für Solitär und größere Anlagen.", "img": [{"s": "img/035_0.jpg", "l": "Wuchs"}, {"s": "img/035_1.jpg", "l": "Blatt"}, {"s": "img/035_2.jpg", "l": "Blüte"}]}, {"id": 36, "g": "L", "lat": "Betula pendula", "de": "Hänge-Birke", "mk": "Weiße, quer aufreißende Rinde, Zweige hängend. Blätter dreieckig-rautenförmig, doppelt gesägt. Pionierbaum, Flachwurzler, lichtbedürftig. Bruchkätzchen im Herbst.", "img": [{"s": "img/036_0.jpg", "l": "Wuchs"}, {"s": "img/036_1.jpg", "l": "Blatt"}, {"s": "img/036_2.jpg", "l": "Rinde"}, {"s": "img/036_3.jpg", "l": "Kätzchen"}]}, {"id": 37, "g": "L", "lat": "Carpinus betulus", "de": "Hainbuche", "mk": "Blätter doppelt gesägt mit deutlichen Seitennerven (gefaltet). Stamm glatt, grau, mit Längsfalten. Früchte als dreilappige Flügelnüsschen. Sehr schnittverträglich, Heckenpflanze.", "img": [{"s": "img/037_0.jpg", "l": "Wuchs"}, {"s": "img/037_1.jpg", "l": "Blatt"}, {"s": "img/037_2.jpg", "l": "Rinde"}]}, {"id": 38, "g": "L", "lat": "Castanea sativa", "de": "Edelkastanie", "mk": "Lange, lanzettliche, grob gesägte Blätter mit Stachelspitzen. Stamm mit schraubig gedrehter Rinde (Furchen). Stachelige Fruchthüllen mit essbaren Maronen. Wärmeliebend, kalkmeidend.", "img": [{"s": "img/038_0.jpg", "l": "Wuchs"}, {"s": "img/038_1.jpg", "l": "Blatt"}, {"s": "img/038_2.jpg", "l": "Frucht (Igel)"}, {"s": "img/038_3.jpg", "l": "Rinde"}]}, {"id": 39, "g": "L", "lat": "Catalpa bignonioides", "de": "Gewöhnlicher Trompetenbaum", "mk": "Sehr große, herzförmige Blätter. Weiße Rispen mit gelb-lila Zeichnung im Juni/Juli. Lange, bohnenartige Früchte hängen den Winter über. Austrieb spät.", "img": [{"s": "img/039_0.jpg", "l": "Wuchs"}, {"s": "img/039_1.jpg", "l": "Blüte und Blatt"}, {"s": "img/039_2.jpg", "l": "Fruchthülsen"}, {"s": "img/039_3.jpg", "l": "Rinde"}]}, {"id": 40, "g": "L", "lat": "Corylus colurna", "de": "Baumhasel", "mk": "Gerade Stammform, regelmäßige kegelförmige Krone. Blätter herzförmig, doppelt gesägt. Fruchthüllen zerschlitzt, bärtig. Gut als Straßenbaum, rindenartig korkig im Alter.", "img": [{"s": "img/040_0.jpg", "l": "Wuchs"}, {"s": "img/040_1.jpg", "l": "Blätter"}, {"s": "img/040_2.jpg", "l": "Fruchthülle"}, {"s": "img/040_3.jpg", "l": "Rinde"}]}, {"id": 41, "g": "L", "lat": "Crataegus monogyna", "de": "Eingriffeliger Weißdorn", "mk": "Blätter tief 3–7 lappig, Dornen an Zweigen. Weiße Doldenblüten im Mai mit nur einem Griffel. Rote erbsengroße Früchte (Apfelfrüchte) mit einem Stein.", "img": [{"s": "img/041_0.jpg", "l": "Wuchs"}, {"s": "img/041_1.jpg", "l": "Blätter und Früchte"}, {"s": "img/041_2.jpg", "l": "Blüte"}, {"s": "img/041_3.jpg", "l": "Dorn"}]}, {"id": 42, "g": "L", "lat": "Fagus sylvatica", "de": "Rotbuche", "mk": "Glatte, graue Rinde. Blätter oval, ganzrandig bis leicht gewellt, am Rand bewimpert. Schlanke, spitze Knospen. Früchte Bucheckern. Blätter bleiben bei Hecken im Winter hängen (Marcescenz).", "img": [{"s": "img/042_0.jpg", "l": "Wuchs"}, {"s": "img/042_1.jpg", "l": "Blätter und Blüten"}, {"s": "img/042_2.jpg", "l": "Fruchtbecher"}, {"s": "img/042_3.jpg", "l": "Rinde"}, {"s": "img/042_4.jpg", "l": "Knospe"}]}, {"id": 43, "g": "L", "lat": "Fraxinus excelsior", "de": "Gewöhnliche Esche", "mk": "Gefiederte Blätter, gegenständig. Knospen samtig-schwarz. Flügelnüsse in Büscheln. Gefährdet durch Eschentriebsterben (Hymenoscyphus fraxineus).", "img": [{"s": "img/043_0.jpg", "l": "Wuchs"}, {"s": "img/043_1.jpg", "l": "Schwarze Knospe"}, {"s": "img/043_2.jpg", "l": "Rinde"}]}, {"id": 44, "g": "L", "lat": "Fraxinus ornus", "de": "Blumenesche", "mk": "Kleinerer Baum mit weißen duftenden Blütenrispen im Mai–Juni, braune Knospen. Gefiederte Blätter mit 5–9 Teilblättchen. Gut als Straßenbaum, wärmeliebend.", "img": [{"s": "img/044_0.jpg", "l": "Blüte und Blatt"}, {"s": "img/044_1.jpg", "l": "Wuchs"}, {"s": "img/044_2.jpg", "l": "Flügelfrüchte"}, {"s": "img/044_3.jpg", "l": "Fiederblatt"}]}, {"id": 45, "g": "L", "lat": "Gleditsia triacanthos", "de": "Amerikanische Gleditschie", "mk": "Stamm und Äste oft mit mächtigen, verzweigten Dornen (Sorte ‘Inermis’ dornenlos). Paarig gefiederte Blätter, lichte Krone. Lange, braune, gedrehte Hülsen.", "img": [{"s": "img/045_0.jpg", "l": "Wuchs"}, {"s": "img/045_1.jpg", "l": "Fiederblatt"}, {"s": "img/045_2.jpg", "l": "Dornen und Rinde"}, {"s": "img/045_3.jpg", "l": "Hülsen"}, {"s": "img/045_4.jpg", "l": "Dorn"}]}, {"id": 46, "g": "L", "lat": "Juglans regia", "de": "Echte Walnuss", "mk": "Gefiederte, ganzrandige Blätter (5–9), aromatisch duftend. Frucht grüne Schale mit Walnuss. Rinde glatt, grau. Stark wachsend, Bodenfeuchtigkeit nötig, Wurzelkonkurrenz.", "img": [{"s": "img/046_0.jpg", "l": "Wuchs (Winter)"}, {"s": "img/046_1.jpg", "l": "Blatt (gefiedert)"}, {"s": "img/046_2.jpg", "l": "Rinde"}, {"s": "img/046_3.jpg", "l": "Männliche Kätzchen"}]}, {"id": 47, "g": "L", "lat": "Juglans nigra", "de": "Schwarznuss", "mk": "Gefiederte Blätter mit 15–23 Fiedern, gesägt. Dunkelbraune bis schwarze, tief gefurchte Rinde. Runde Früchte mit sehr hartem Kern. Hochwertiges Holz.", "img": [{"s": "img/047_0.jpg", "l": "Wuchs"}, {"s": "img/047_1.jpg", "l": "Blatt (gefiedert, 15–23)"}, {"s": "img/047_2.jpg", "l": "Rinde"}, {"s": "img/047_3.jpg", "l": "Knospe"}]}, {"id": 48, "g": "L", "lat": "Liquidambar styraciflua", "de": "Amerikanischer Amberbaum", "mk": "Blätter fünflappig, ähnlich Ahorn, aber wechselständig. Auffällige orange-rote bis violette Herbstfärbung. Stachelige Fruchtstände (Igelkugeln), Rinde mit Korkleisten.", "img": [{"s": "img/048_0.jpg", "l": "Herbstfärbung"}, {"s": "img/048_1.jpg", "l": "Blatt (fünflappig)"}, {"s": "img/048_2.jpg", "l": "Rinde"}, {"s": "img/048_3.jpg", "l": "Fruchtstand (Igel)"}]}, {"id": 49, "g": "L", "lat": "Liriodendron tulipifera", "de": "Tulpenbaum", "mk": "Blätter mit gestutzter Spitze (wie abgeschnitten), vierlappig. Grünlich-gelbe tulpenähnliche Blüten im Mai/Juni. Gelbe Herbstfärbung. Rinde grau, gefurcht.", "img": [{"s": "img/049_0.jpg", "l": "Wuchs (Winter)"}, {"s": "img/049_1.jpg", "l": "Blatt (Tulpenbaumblatt)"}, {"s": "img/049_2.jpg", "l": "Blüte"}, {"s": "img/049_3.jpg", "l": "Fruchtstände"}, {"s": "img/049_4.jpg", "l": "Rinde"}]}, {"id": 50, "g": "L", "lat": "Mespilus germanica", "de": "Echte Mispel", "mk": "Kleiner Baum oder Strauch, große weiße Einzelblüten, Blätter ungeteilt. Apfelfrüchte braun, mit Kelchzipfeln, erst nach Frost genießbar. Wärmeliebend.", "img": [{"s": "img/050_0.jpg", "l": "Wuchs"}, {"s": "img/050_1.jpg", "l": "Blätter"}, {"s": "img/050_2.jpg", "l": "Blüte"}, {"s": "img/050_3.jpg", "l": "Früchte (Mispeln)"}, {"s": "img/050_4.jpg", "l": "Stamm"}]}, {"id": 51, "g": "L", "lat": "Morus alba", "de": "Weißer Maulbeerbaum", "mk": "Blätter herzförmig bis gelappt, glänzend, glatt. Früchte (Scheinbeeren) weiß bis rosa, süß. Blätter dienen als Futter für Seidenraupen.", "img": [{"s": "img/051_0.jpg", "l": "Wuchs"}, {"s": "img/051_1.jpg", "l": "Blattformen"}, {"s": "img/051_2.jpg", "l": "Früchte"}, {"s": "img/051_3.jpg", "l": "Rinde"}]}, {"id": 52, "g": "L", "lat": "Morus nigra", "de": "Schwarzer Maulbeerbaum", "mk": "Blätter rau, herzförmig, größer. Früchte dunkelrot bis schwarz, saftig. Wärmeliebender als der Weiße Maulbeerbaum, langsam wachsend.", "img": [{"s": "img/052_0.jpg", "l": "Wuchs"}, {"s": "img/052_1.jpg", "l": "Blätter"}, {"s": "img/052_2.jpg", "l": "Frucht"}, {"s": "img/052_3.jpg", "l": "Rinde"}]}, {"id": 53, "g": "L", "lat": "Nothofagus antarctica", "de": "Scheinbuche", "mk": "Kleine, am Rand gewellte, asymmetrische Blätter. Zweige zickzackförmig. Gelbe bis orange Herbstfärbung. Kleinwüchsig, aus Südamerika.", "img": [{"s": "img/053_0.jpg", "l": "Wuchs"}, {"s": "img/053_1.jpg", "l": "Zweig"}, {"s": "img/053_2.jpg", "l": "Blatt"}, {"s": "img/053_3.jpg", "l": "Herbstfärbung"}, {"s": "img/053_4.jpg", "l": "Rinde"}]}, {"id": 54, "g": "L", "lat": "Paulownia tomentosa", "de": "Blauglockenbaum", "mk": "Sehr große, filzig behaarte, herzförmige Blätter. Lilablaue, duftende Blütenrispen im April/Mai. Knospen bereits im Herbst sichtbar. Sehr raschwüchsig. Frostgefahr für die Blüten.", "img": [{"s": "img/054_0.jpg", "l": "Wuchs"}, {"s": "img/054_1.jpg", "l": "Blatt"}, {"s": "img/054_2.jpg", "l": "Blüte"}, {"s": "img/054_3.jpg", "l": "Kapselfrüchte"}, {"s": "img/054_4.jpg", "l": "Rinde"}]}, {"id": 55, "g": "L", "lat": "Platanus × acerifolia", "de": "Ahornblättrige Platane", "mk": "Schuppige, sich abblätternde Rinde (Tarnmuster), große handförmige Blätter, Fruchtstände in Kugeln. Stadtklimafest, anfällig für die Platanen-Netzwanze.", "img": [{"s": "img/055_0.jpg", "l": "Wuchs (Winter)"}, {"s": "img/055_1.jpg", "l": "Blatt"}, {"s": "img/055_2.jpg", "l": "Rinde"}, {"s": "img/055_3.jpg", "l": "Fruchtstände"}]}, {"id": 56, "g": "L", "lat": "Prunus avium", "de": "Vogel-Kirsche", "mk": "Rinde glänzend rotbraun, quer geringelt (Ringelborke). Weiße Blüten im April in Büscheln. Früchte rot bis dunkelrot, sauer bis süß. Blätter länglich, doppelt gesägt mit Drüsen am Blattstiel.", "img": [{"s": "img/056_0.jpg", "l": "Wuchs (Blüte)"}, {"s": "img/056_1.jpg", "l": "Blätter und Früchte"}, {"s": "img/056_2.jpg", "l": "Rinde"}, {"s": "img/056_3.jpg", "l": "Blüte"}]}, {"id": 57, "g": "L", "lat": "Pyrus communis", "de": "Kulturbirne", "mk": "Blätter eiförmig, ganzrandig bis fein gesägt, glänzend. Weiße Blüten in Doldentrauben im April. Birnenfrucht mit Steinzellen. Rinde im Alter in Würfeln aufgerissen.", "img": [{"s": "img/057_0.jpg", "l": "Wuchs"}, {"s": "img/057_1.jpg", "l": "Blätter"}, {"s": "img/057_2.jpg", "l": "Blüte"}, {"s": "img/057_3.jpg", "l": "Frucht"}]}, {"id": 58, "g": "L", "lat": "Quercus petraea", "de": "Traubeneiche", "mk": "Blätter mit deutlichem Blattstiel (1–3 cm), Eicheln sitzen ungestielt in Büscheln. Rinde graubraun, tief gefurcht. Blattgrund keilförmig, ohne Öhrchen.", "img": [{"s": "img/058_0.jpg", "l": "Wuchs"}, {"s": "img/058_1.jpg", "l": "Blätter"}, {"s": "img/058_2.jpg", "l": "Eicheln (sitzend)"}, {"s": "img/058_3.jpg", "l": "Rinde"}]}, {"id": 59, "g": "L", "lat": "Quercus robur", "de": "Stieleiche", "mk": "Blätter fast sitzend mit Öhrchen am Grund, Eicheln an langen Stielen. Rinde tief gefurcht, Krone knorrig. Tiefwurzler, kann sehr alt werden.", "img": [{"s": "img/059_0.jpg", "l": "Wuchs"}, {"s": "img/059_1.jpg", "l": "Blätter (fast sitzend)"}, {"s": "img/059_2.jpg", "l": "Rinde"}, {"s": "img/059_3.jpg", "l": "Winteraspekt"}]}, {"id": 60, "g": "L", "lat": "Quercus rubra", "de": "Amerikanische Roteiche", "mk": "Spitze, borstige Lappen, große Blätter. Auffällige scharlachrote Herbstfärbung. Rinde glatt, silbergrau, im Alter gefurcht. Schnellwüchsig, Straßenbaum.", "img": [{"s": "img/060_0.jpg", "l": "Wuchs (Herbst)"}, {"s": "img/060_1.jpg", "l": "Blätter (spitze Lappen)"}, {"s": "img/060_2.jpg", "l": "Eicheln"}, {"s": "img/060_3.jpg", "l": "Rinde"}]}, {"id": 61, "g": "L", "lat": "Robinia pseudoacacia", "de": "Gewöhnliche Robinie", "mk": "Gefiederte Blätter mit ovalen Teilblättchen, Dornen an den Zweigen. Weiße duftende Schmetterlingsblüten im Mai/Juni. Rinde tief gefurcht. Hülsenfrucht, Stickstoffbinder, Bienenweide, giftig.", "img": [{"s": "img/061_0.jpg", "l": "Wuchs (blühend)"}, {"s": "img/061_1.jpg", "l": "Blatt (gefiedert)"}, {"s": "img/061_2.jpg", "l": "Blüte"}, {"s": "img/061_3.jpg", "l": "Hülsen"}, {"s": "img/061_4.jpg", "l": "Rinde"}]}, {"id": 62, "g": "L", "lat": "Salix alba ‘Tristis’", "de": "Trauerweide", "mk": "Lange, dünne, überhängende Zweige. Schmal lanzettliche Blätter. Wächst rasch, braucht feuchte Böden und viel Platz. Flachwurzler, bruchgefährdet.", "img": [{"s": "img/062_0.jpg", "l": "Wuchs"}, {"s": "img/062_1.jpg", "l": "Zweige (hängend)"}, {"s": "img/062_2.jpg", "l": "Blatt am Zweig"}, {"s": "img/062_3.jpg", "l": "Stamm"}]}, {"id": 63, "g": "L", "lat": "Sophora japonica", "de": "Japanischer Schnurbaum", "mk": "Gefiederte Blätter, glänzend grün. Weiße Blütenrispen im August. Schnurartige, perlschnurartig eingeschnürte Hülsen. Rinde grau, rissig, Stadtklimabaum.", "img": [{"s": "img/063_0.jpg", "l": "Wuchs"}, {"s": "img/063_1.jpg", "l": "Blatt (gefiedert)"}, {"s": "img/063_2.jpg", "l": "Blüte"}, {"s": "img/063_3.jpg", "l": "Hülsen (perlschnurartig)"}, {"s": "img/063_4.jpg", "l": "Rinde"}]}, {"id": 64, "g": "L", "lat": "Sorbus aucuparia", "de": "Eberesche", "mk": "Gefiederte Blätter mit gesägten Teilblättchen, Blüte in weißen Schirmrispen. Orangerote Früchte in Dolden (Vogelbeeren). Rinde glatt, grau. Heimisch, Vogelnährgehölz.", "img": [{"s": "img/064_0.jpg", "l": "Wuchs"}, {"s": "img/064_1.jpg", "l": "Gefiederte Blätter und Früchte"}, {"s": "img/064_2.jpg", "l": "Blüte"}, {"s": "img/064_3.jpg", "l": "Früchte"}, {"s": "img/064_4.jpg", "l": "Rinde"}]}, {"id": 65, "g": "L", "lat": "Tilia cordata", "de": "Winterlinde", "mk": "Herzförmige Blätter, unterseits mit rostbraunen Haarbüscheln in den Aderwinkeln. Blüte im pg", "l": "Herbstblatt"}]}, {"id": 70, "g": "S", "lat": "Buddleja davidii", "de": "Sommerflieder", "mk": "Lange, violette, duftende Blütenrispen im Juli–September. Lockt Schmetterlinge an. Blätter lanzettlich, unterseits filzig. Rückschnitt im Frühjahr, kann verwildern.", "img": [{"s": "img/070_0.jpg", "l": "Wuchs"}, {"s": "img/070_1.jpg", "l": "Blätter (unten filzig)"}, {"s": "img/070_2.jpg", "l": "Blüte"}, {"s": "img/070_3.jpg", "l": "Fruchtstand"}]}, {"id": 71, "g": "S", "lat": "Buxus sempervirens", "de": "Gewöhnlicher Buchsbaum", "mk": "Immergrün, kleine, gegenständige, ovale, glänzende Blätter. Gut formbar. Gefährdet durch Buchsbaumzünsler und Triebsterben (Cylindrocladium).", "img": [{"s": "img/071_0.jpg", "l": "Wuchs"}, {"s": "img/071_1.jpg", "l": "Blätter"}, {"s": "img/071_2.jpg", "l": "Blüte"}, {"s": "img/071_3.jpg", "l": "Früchte"}]}, {"id": 72, "g": "S", "lat": "Calluna vulgaris", "de": "Besenheide", "mk": "Kleiner Zwergstrauch, schuppenförmige Blätter, rosa bis violette Blütenglöckchen im Spätsommer. Braucht saure, nährstoffarme Böden und volle Sonne.", "img": [{"s": "img/072_0.jpg", "l": "Wuchs"}, {"s": "img/072_1.jpg", "l": "Triebe"}, {"s": "img/072_2.jpg", "l": "Blüte"}]}, {"id": 73, "g": "S", "lat": "Camellia japonica", "de": "Japanische Kamelie", "mk": "Immergrün, ledrige, glänzende, gesägte Blätter. Große Blüten von Februar bis April. Braucht sauren, durchlässigen Boden, geschützten Standort.", "img": [{"s": "img/073_0.jpg", "l": "Wuchs"}, {"s": "img/073_1.jpg", "l": "Blätter"}, {"s": "img/073_2.jpg", "l": "Blüte"}, {"s": "img/073_3.jpg", "l": "Kapselfrucht"}]}, {"id": 74, "g": "S", "lat": "Campsis radicans", "de": "Trompetenblume", "mk": "Kletterer mit Haftwurzeln, gefiederten Blättern, orangeroten Trichterblüten im Hochsommer. Wärmeliebend, braucht Kletterhilfe.", "img": [{"s": "img/074_0.jpg", "l": "Wuchs"}, {"s": "img/074_1.jpg", "l": "Blatt (gefiedert)"}, {"s": "img/074_2.jpg", "l": "Blüte"}, {"s": "img/074_3.jpg", "l": "Fruchtschoten"}]}, {"i artriegel", "mk": "Im Winter rote Zweige (rotholziger Hartriegel). Weiße Blütendolden, schwarze Früchte. Blätter gegenständig, ganzrandig, Seitennerven bogenförmig. Heimisch, kalkliebend.", "img": [{"s": "img/080_0.jpg", "l": "Wuchs"}, {"s": "img/080_1.jpg", "l": "Blüte"}, {"s": "img/080_2.jpg", "l": "Blätter"}, {"s": "img/080_3.jpg", "l": "rote Winterzweige"}, {"s": "img/080_4.jpg", "l": "Früchte"}]}, {"id": 81, "g": "S", "lat": "Cornus stolonifera", "de": "Gelbholz-Hartriegel", "mk": "Gelbe bis gelbgrüne Triebe (‘Flaviramea’). Ausläuferbildend, bildet dichte Bestände. Für feuchte Böden, Winterfärbung.", "img": [{"s": "img/081_0.jpg", "l": "Wuchs"}, {"s": "img/081_1.jpg", "l": "Gelbe Triebe (Sorte Flaviramea)"}, {"s": "img/081_2.jpg", "l": "Blatt"}, {"s": "img/081_3.jpg", "l": "Blüte"}, {"s": "img/081_4.jpg", "l": "Früchte"}]}, {"id": 82, "g": "S", "lat": "Corylus avellana", "de": "Haselnuss", "mk": "Kätzchen im Februar/März, Blätter rundlich, doppelt gesägt, behaart. Nüsse in zerschlitzten Hüllen. Heimisch, mehrstämmig.", "img": [{"s": "img/082_0.jpg", "l": "Wuchs"}, {"s": "img/082_1.jpg", "l": "Blätter (rundlich, doppelt gesägt)"}, {"s": "img/082_2.jpg", "l": "Männliche Kätzchen"}, {"s": "img/082_3.jpg", "l": "Nüsse"}, {"s": "img/082_4.jpg", "l": "Rinde"}]}, {"id": 83, "g": "S", "lat": "Corylus avellana ‘Contorta’", "de": "Korkenzieherhasel", "mk": "Verdrehte, korkenzieherartig gewundene Triebe. Zierwert im Winter. Veredelt, Wildtriebe der Unterlage entfernen.", "img": [{"s": "img/083_0.jpg", "l": "Wuchs (Winter)"}, {"s": "img/083_1.jpg", "l": "Gedrehte Triebe mit Kätzchen"}, {"s": "img/083_2.jpg", "l": "Blätter (gekräuselt)"}]}, {"id": 84, "g": "S", "lat": "Cotinus coggygria", "de": "Perückenstrauch", "mk": "Rundliche Blätter, orangerote Herbstfärbung. Rauchartig behaarte Fruchtstände nach der Blüte. Sorten mit rotem Laub (‘Royal Purple’). Wärmeliebend.", "img": [{"s": "img/084_0.jpg", "l": "Wuchs"}, {"s": "img/084_1.jpg", "l": "Blätter (rundlich)"}, {"s": "img/ "l": "Blüte"}, {"s": "img/123_2.jpg", "l": "Knospen"}]}, {"id": 124, "g": "S", "lat": "Viburnum rhytidophyllum", "de": "Runzelblättriger Schneeball", "mk": "Immergrün, große, dunkelgrüne, runzlige Blätter, unterseits filzig. Gelblich-weiße Blüten im Mai, rote bis schwarze Früchte. Schattenverträglich.", "img": [{"s": "img/124_0.jpg", "l": "Wuchs"}, {"s": "img/124_1.jpg", "l": "Blatt (Unterseite filzig)"}, {"s": "img/124_2.jpg", "l": "Blüte"}, {"s": "img/124_3.jpg", "l": "Früchte"}]}, {"id": 125, "g": "S", "lat": "Viburnum opulus", "de": "Gewöhnlicher Schneeball", "mk": "Dreilappige, ahornähnliche Blätter, weiße Schirmrispen im Mai. Rote Früchte, giftig. Rote Herbstfärbung. Heimisch, Feuchtigkeit liebend.", "img": [{"s": "img/125_0.jpg", "l": "Wuchs"}, {"s": "img/125_1.jpg", "l": "Blatt (dreilappig)"}, {"s": "img/125_2.jpg", "l": "Blüte"}, {"s": "img/125_3.jpg", "l": "Früchte"}]}, {"id": 126, "g": "S", "lat": "Weigela ‘Bristol Ruby’", "de": "Weigelie", "mk": "Trichterförmige, rubinrote Blüten im Mai–Juni. Gegenständige, gesägte Blätter. Aufrechter Wuchs, Auslichtungsschnitt nach der Blüte.", "img": [{"s": "img/126_0.jpg", "l": "Wuchs"}, {"s": "img/126_1.jpg", "l": "Blatt und Blüte"}, {"s": "img/126_2.jpg", "l": "Blüte"}]}, {"id": 127, "g": "S", "lat": "Yucca filamentosa", "de": "Palmlilie", "mk": "Schwertförmige, immergrüne Blätter in Rosette, Blattränder mit Fäden. Cremeweiße Blütenrispen im Hochsommer, bis 2 m. Sonne, durchlässiger Boden, winterhart.", "img": [{"s": "img/127_0.jpg", "l": "Blattrosette"}, {"s": "img/127_1.jpg", "l": "Blütenstand"}, {"s": "img/127_2.jpg", "l": "Blüte"}]}, {"id": 128, "g": "H", "lat": "Lavandula angustifolia", "de": "Echter Lavendel", "mk": "Graugrüne, linealische Blätter, duftend. Blauviolette Blütenähren im Juni–August. Nur sonnig und trocken, im Frühjahr zurückschneiden, nicht ins alte Holz.", "img": [{"s": "img/128_0.jpg", "l": "Wuchs (blühend)"}, {"s": "img/128_1.jpg", "l": "Blätter"}, {"s": "img/128_2.jpg", "l": "Blüten"}]}, {"id": 129, "g": "H", "lat": "Perovskia atriplicifolia", "de": "Silberbusch / Blauraute", "mk": "Silbrig-weiße, aromatische Stängel, fein gefiederte Blätter. Blaue Blütenrispen im August–Oktober. Im Frühjahr stark zurückschneiden. Trockenheitsverträglich.", "img": [{"s": "img/129_0.jpg", "l": "Wuchs"}, {"s": "img/129_1.jpg", "l": "Blatt (fein gefiedert)"}, {"s": "img/129_2.jpg", "l": "Blüte"}]}, {"id": 130, "g": "H", "lat": "Rosmarinus officinalis", "de": "Echter Rosmarin", "mk": "Immergrün, nadelförmige, aromatische Blätter. Blaue Blüten im Frühjahr. Wärmeliebend, bei uns nur in milden Lagen oder mit Schutz winterhart. Auch Salvia rosmarinus.", "img": [{"s": "img/130_0.jpg", "l": "Wuchs"}, {"s": "img/130_1.jpg", "l": "Nadelblätter"}, {"s": "img/130_2.jpg", "l": "Blüte"}]}, {"id": 131, "g": "H", "lat": "Salvia officinalis", "de": "Echter Salbei", "mk": "Graugrüne, runzelige, behaarte Blätter, aromatisch. Violettblaue Lippenblüten im Juni–Juli. Würz- und Heilpflanze, sonnig und trocken.", "img": [{"s": "img/131_0.jpg", "l": "Wuchs (blühend)"}, {"s": "img/131_1.jpg", "l": "Blatt (runzelig, graufilzig)"}, {"s": "img/131_2.jpg", "l": "Blüte"}, {"s": "img/131_3.jpg", "l": "Fruchtstand"}]}, {"id": 132, "g": "H", "lat": "Thymus vulgaris", "de": "Echter Thymian", "mk": "Kleine, graugrüne, aromatische Blätter, rosa bis weiße Blüten (Juni). Polsterbildend, sonnig und trocken. Würzpflanze.", "img": [{"s": "img/132_0.jpg", "l": "Wuchs (blühend)"}, {"s": "img/132_1.jpg", "l": "Zweig mit Blättern"}, {"s": "img/132_2.jpg", "l": "Blüte"}, {"s": "img/132_3.jpg", "l": "Wuchs (Strauch)"}]}];
const GRP={"K": "Koniferen", "L": "Laubbäume", "S": "Sträucher und Kletterer", "H": "Halbsträucher"};
const KEY='pflanzen_kurs01_v1';
let prog={};try{prog=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(prog))}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let mode='karten',grp='ALL',only='alle',q='';
const tabs=[['karten','Karten'],['bild','Foto-Quiz'],['merk','Merkmal-Quiz'],['liste','Liste'],['stand','Stand']];
function nav(){$('#nav').innerHTML=tabs.map(t=>`<button class="${mode==t[0]?'on':''}" data-m="${t[0]}">${t[1]}</button>`).join('');
 document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;nav();render()})}
function pool(){return DATA.filter(p=>(grp=='ALL'||p.g==grp)&&(only=='alle'||(only=='offen'&&prog[p.id]!='k')||(only=='schwer'&&prog[p.id]=='n')))}
function filters(extra=''){
 return `<div class="row"><select id="fg"><option value="ALL">Alle Gruppen</option>${Object.keys(GRP).map(k=>`<option value="${k}" ${grp==k?'selected':''}>${GRP[k]}</option>`).join('')}</select>
 <select id="fo"><option value="alle" ${only=='alle'?'selected':''}>Alle</option><option value="offen" ${only=='offen'?'selected':''}>Noch nicht gekonnt</option><option value="schwer" ${only=='schwer'?'selected':''}>Nur Schwere</option></select>${extra}</div>`}
function bindFilters(){const g=$('#fg'),o=$('#fo');if(g)g.onchange=()=>{grp=g.value;cur=null;render()};if(o)o.onchange=()=>{only=o.value;cur=null;render()}}
function photos(p,n){return `<div class="photos">${p.img.slice(0,n||9).map((i,k)=>`<figure><img loading="lazy" src="${i.s}" alt="" data-p="${p.id}" data-k="${k}" data-show="1"><figcaption>${esc(i.l)}</figcaption></figure>`).join('')}</div>`}
function photosHidden(p,n){return `<div class="photos">${p.img.slice(0,n).map((i,k)=>`<figure><img loading="lazy" src="${i.s}" alt="" data-p="${p.id}" data-k="${k}" data-show="${quizHide?0:1}"></figure>`).join('')}</div>`}
let quizHide=false;
/* Lightbox */
let lbP=null,lbK=0,lbHide=false;
function lbShow(){const p=DATA[lbP],i=p.img[lbK];const n=lbHide?p.img.length:p.img.length;
 $('#lbi').src=i.s;$('#lbc').innerHTML=lbHide?`Foto ${lbK+1} von ${p.img.length}`:`<b>${esc(p.de)}</b> <i>${esc(p.lat)}</i><small>${esc(i.l)} · Foto ${lbK+1} von ${p.img.length}</small>`;
 $('#lb').classList.add('on')}
function lbClose(){$('#lb').classList.remove('on')}
$('#lb').addEventListener('click',e=>{if(e.target.id!=='lbi'&&!e.target.closest('button'))lbClose()});
function lbStep(d){const n=DATA[lbP].img.length;lbK=(lbK+d+n)%n;lbShow()}
document.addEventListener('click',e=>{const t=e.target;
 if(t.matches&&t.matches('img[data-p]')){lbP=+t.dataset.p;lbK=+t.dataset.k;lbHide=t.dataset.show==='0';lbShow();return}
 if(t.matches&&t.matches('.item img')){lbP=+t.closest('.item').dataset.i;lbK=0;lbHide=false;lbShow();e.stopPropagation()}},true);
document.addEventListener('keydown',e=>{if(!$('#lb').classList.contains('on'))return;if(e.key=='Escape')lbClose();if(e.key=='ArrowRight')lbStep(1);if(e.key=='ArrowLeft')lbStep(-1)});
let tx=null;document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{if(tx===null||!$('#lb').classList.contains('on'))return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>50)lbStep(dx<0?1:-1)},{passive:true});
let cur=null,flip=false,quiz=null;
function render(){quizHide=false;const m=$('#m');({karten,bild,merk,liste,stand})[mode](m)}
function nextCard(){const P=pool();if(!P.length){cur=null;return}
 // Gewichtung: Schwere 3x, ungelernte 2x, gekonnte 1x
 const w=[];P.forEach(p=>{const n=prog[p.id]=='n'?3:prog[p.id]=='k'?1:2;for(let i=0;i<n;i++)w.push(p)});
 let c=rnd(w);if(P.length>1)while(cur&&c.id==cur.id)c=rnd(w);cur=c;flip=false}
function karten(m){
 if(!cur||!pool().find(p=>p.id==cur.id))nextCard();
 let h=filters()+`<div class="hint" style="margin-bottom:8px">Tipp: Erst Foto ansehen, Namen überlegen, dann aufdecken.</div>`;
 if(!cur){m.innerHTML=h+'<div class="card">Keine Pflanzen in dieser Auswahl.</div>';bindFilters();return}
 const p=cur;
 h+=`<div class="card"><span class="tag">${GRP[p.g]} · ${pool().length} in Auswahl</span>`;
 if(!flip){quizHide=true;h+=photosHidden(p,4)+`<div style="text-align:center;margin-top:12px"><button class="btn" id="fl">Aufdecken</button></div>`}
 else{h+=photos(p)+`<div class="big"><span class="lat">${esc(p.lat)}</span><br><span class="de">${esc(p.de)}</span></div><div class="mk"><b>Merkmale:</b> ${esc(p.mk)}</div>
  <div class="row" style="margin-top:14px"><button class="btn bad" id="nk">Muss ich üben</button><button class="btn ok" id="kk">Gewusst</button></div>`}
 h+='</div>';m.innerHTML=h;bindFilters();
 if($('#fl'))$('#fl').onclick=()=>{flip=true;render()};
 if($('#nk'))$('#nk').onclick=()=>{prog[p.id]='n';save();nextCard();render();scrollTo(0,0)};
 if($('#kk'))$('#kk').onclick=()=>{prog[p.id]='k';save();nextCard();render();scrollTo(0,0)}}
function mkQ(kind){
 const P=pool();if(!P.length)return null;
 const w=[];P.forEach(p=>{const n=prog[p.id]=='n'?3:prog[p.id]=='k'?1:2;for(let i=0;i<n;i++)w.push(p)});
 let c=rnd(w);if(P.length>1)while(quiz&&quiz.p&&c.id==quiz.p.id)c=rnd(w);
 const same=DATA.filter(x=>x.g==c.g&&x.id!=c.id);const others=DATA.filter(x=>x.id!=c.id);
 let d=shuffle(same).slice(0,3);if(d.length<3)d=d.concat(shuffle(others.filter(x=>!d.includes(x))).slice(0,3-d.length));
 return {p:c,opts:shuffle([c].concat(d)),done:false,kind,sel:null}}
let score={r:0,n:0};
function quizView(m,kind){
 if(!quiz||quiz.kind!=kind||!pool().find(p=>p.id==quiz.p.id))quiz=mkQ(kind);
 let h=filters(`<button class="btn sec" id="rs">Zähler zurücksetzen</button>`)+`<div class="stat"><span>Richtig: ${score.r}</span><span>Gesamt: ${score.n}</span><span>${score.n?Math.round(100*score.r/score.n):0}%</span></div>`;
 if(!quiz){m.innerHTML=h+'<div class="card">Keine Pflanzen in dieser Auswahl.</div>';bindFilters();return}
 const p=quiz.p;
 h+=`<div class="card"><span class="tag">${GRP[p.g]}</span>`;
 if(kind=='bild')h+=`<div class="big"><b>Welche Pflanze ist das?</b></div>`+(quiz.done?photos(p):(quizHide=true,photosHidden(p,4)));
 else h+=`<div class="big"><b>Welche Pflanze passt zu diesen Merkmalen?</b></div><div class="mk" style="font-size:15px">${esc(p.mk)}</div>`+(quiz.done?photos(p):'');
 h+=`<div class="opts">${quiz.opts.map((o,i)=>{let c='';if(quiz.done){if(o.id==p.id)c='right';else if(quiz.sel==i)c='wrong'}
   return `<button class="${c}" data-i="${i}" ${quiz.done?'disabled':''}>${esc(o.de)}<br><span class="hint" style="color:inherit;opacity:.8"><i>${esc(o.lat)}</i></span></button>`}).join('')}</div>`;
 if(quiz.done)h+=`<div class="mk"><b>${esc(p.de)}</b> (<i>${esc(p.lat)}</i>)<br>${kind=='bild'?esc(p.mk):''}</div><div class="row" style="margin-top:12px"><button class="btn" id="nx">Nächste Frage</button></div>`;
 h+='</div>';m.innerHTML=h;bindFilters();
 $('#rs').onclick=()=>{score={r:0,n:0};render()};
 document.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{if(quiz.done)return;const i=+b.dataset.i;quiz.sel=i;quiz.done=true;score.n++;
   if(quiz.opts[i].id==p.id){score.r++;if(prog[p.id]!='k')prog[p.id]='k'}else prog[p.id]='n';save();render()});
 if($('#nx'))$('#nx').onclick=()=>{quiz=mkQ(kind);render();scrollTo(0,0)}}
function bild(m){quizView(m,'bild')} function merk(m){quizView(m,'merk')}
function liste(m){
 let L=DATA.filter(p=>(grp=='ALL'||p.g==grp)&&(!q||(p.lat+' '+p.de+' '+p.mk).toLowerCase().includes(q.toLowerCase())));
 let h=filters(`<input type="search" id="sq" placeholder="Suchen (Name oder Merkmal)" value="${esc(q)}">`)+`<div class="hint">${L.length} Pflanzen. Antippen zeigt Fotos und Merkmale.</div><div id="ll"></div>`;
 m.innerHTML=h;bindFilters();
 $('#sq').oninput=e=>{q=e.target.value;listBody(DATA.filter(p=>(grp=='ALL'||p.g==grp)&&(!q||(p.lat+' '+p.de+' '+p.mk).toLowerCase().includes(q.toLowerCase()))))};
 listBody(L)}
function listBody(L){$('#ll').innerHTML=L.map(p=>`<div class="item" data-i="${p.id}"><span class="dot ${prog[p.id]||''}"></span><img loading="lazy" src="${p.img[0].s}" alt=""><div><b>${esc(p.de)}</b><br><i>${esc(p.lat)}</i><div class="s">${GRP[p.g]}</div></div></div><div class="card hide" id="d${p.id}"></div>`).join('');
 document.querySelectorAll('.item').forEach(e=>e.onclick=()=>{const p=DATA[+e.dataset.i],d=$('#d'+p.id);if(d.classList.contains('hide')){d.innerHTML=photos(p)+`<div class="mk"><b>Merkmale:</b> ${esc(p.mk)}</div>`;d.classList.remove('hide')}else d.classList.add('hide')})}
function stand(m){
 const k=DATA.filter(p=>prog[p.id]=='k').length,n=DATA.filter(p=>prog[p.id]=='n').length;
 let h=`<div class="card"><div class="big"><b>Dein Lernstand</b></div><div class="stat"><span>Gekonnt: ${k}</span><span>Üben: ${n}</span><span>Noch nicht angesehen: ${DATA.length-k-n}</span></div><div class="bar"><i style="width:${100*k/DATA.length}%"></i></div></div>`;
 h+=Object.keys(GRP).map(g=>{const L=DATA.filter(p=>p.g==g),kk=L.filter(p=>prog[p.id]=='k').length;return `<div class="card"><b>${GRP[g]}</b> <span class="hint">${kk} von ${L.length} gekonnt</span><div class="bar"><i style="width:${100*kk/L.length}%"></i></div></div>`}).join('');
 const hard=DATA.filter(p=>prog[p.id]=='n');
 if(hard.length)h+=`<div class="card"><b>Noch üben</b><div class="mk">${hard.map(p=>esc(p.de)).join(', ')}</div></div>`;
 h+=`<div class="card"><b>Offline nutzen</b><div class="hint" style="margin:4px 0 8px">Lädt alle ${DATA.reduce((a,p)=>a+p.img.length,0)} Fotos (ca. 30 MB) einmal aufs Gerät, dann läuft die App auch ohne Netz. Am besten im WLAN.</div><button class="btn sec" id="off">Alle Fotos offline speichern</button><div class="bar"><i id="offb" style="width:0%"></i></div><div class="hint" id="offt"></div></div>`;
 h+=`<div class="row"><button class="btn sec" id="rp">Lernstand zurücksetzen</button></div><div class="hint">Der Lernstand wird nur in diesem Browser auf diesem Gerät gespeichert.</div>`;
 m.innerHTML=h;$('#off').onclick=offline;$('#rp').onclick=()=>{if(confirm('Lernstand wirklich löschen?')){prog={};save();render()}}}
async function offline(){
 if(!('caches' in window)){$('#offt').textContent='Dieser Browser kann nicht offline speichern.';return}
 const urls=[];DATA.forEach(p=>p.img.forEach(i=>urls.push(i.s)));
 const c=await caches.open('pflanzen-img-v1');let n=0,fail=0;
 $('#off').disabled=true;
 for(const u of urls){try{if(!(await c.match(u))){const r=await fetch(u);if(r.ok)await c.put(u,r);else fail++}}catch(e){fail++}
  n++;$('#offb').style.width=(100*n/urls.length)+'%';$('#offt').textContent=n+' von '+urls.length}
 $('#offt').textContent=fail?('Fertig, '+fail+' Fotos fehlen (Netz?). Nochmal versuchen.'):'Fertig: alle Fotos sind offline verfügbar.';$('#off').disabled=false}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
nav();render();
</script>
</body>
